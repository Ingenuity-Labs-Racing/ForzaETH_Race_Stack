# Nav2 AMCL (particle filter) on the ground-truth map, for comparison with SLAM Toolbox.
# The initial pose is set by launch/amcl.launch.py from the spawn pose.
amcl:
  ros__parameters:
    # Frames and topics
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: scan
    map_topic: map
    tf_broadcast: true
    transform_tolerance: 0.2        # [s] map->odom is stamped this far ahead

    # Motion model. The sandbox car is diff-drive and its odometry is perfect, so the
    # noise terms (alpha1-4: rot<-rot, rot<-trans, trans<-trans, trans<-rot) are small.
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05

    # Filter updates - same travel thresholds as config/localization.yaml
    update_min_d: 0.1               # [m]
    update_min_a: 0.1               # [rad]
    resample_interval: 1
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0        # 0 = no random particles injected when lost
    recovery_alpha_slow: 0.0
    save_pose_rate: 0.5

    # Laser model
    laser_model_type: likelihood_field
    laser_min_range: 0.1
    laser_max_range: 20.0           # same cap as SLAM Toolbox's max_laser_range
    max_beams: 60                   # beams used per update, out of 1081
    laser_likelihood_max_dist: 2.0
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.2
    do_beamskip: false

map_server:
  ros__parameters:
    topic_name: map
    frame_id: map
